<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Library Management</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        *{box-sizing:border-box;}
        body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .box{background:#fff;border-radius:12px;padding:36px 40px;width:420px;max-width:95vw;box-shadow:0 4px 20px rgba(0,0,0,.1);}
        .box h2{margin:0 0 6px;font-size:22px;color:#1a1a2e;text-align:center;}
        .box p.sub{text-align:center;color:#777;font-size:14px;margin:0 0 24px;}
        label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:4px;}
        input{width:100%;padding:11px 13px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none;margin-bottom:16px;}
        input:focus{border-color:#1a1a2e;}
        .btn{width:100%;padding:12px;background:#1a1a2e;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
        .btn:hover{background:#0f3460;}
        .msg{text-align:center;margin-top:14px;font-size:14px;font-weight:600;min-height:20px;}
        .back-link{text-align:center;margin-top:18px;font-size:14px;}
        .back-link a{color:#0f3460;text-decoration:none;}
    </style>
</head>
<body>

<div class="box">
    <div style="text-align:center;font-size:40px;margin-bottom:10px;">🔑</div>
    <h2>Reset Password</h2>
    <p class="sub">Enter a new password for your account.</p>

    <form id="resetForm">
        <input type="hidden" id="token">

        <label for="password">New Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Repeat new password" required minlength="6">

        <button type="submit" class="btn">Set New Password</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="back-link"><a href="/login">&larr; Back to Login</a></div>
</div>

<script>
    // Read token from URL query string
    const params = new URLSearchParams(window.location.search);
    const token  = params.get("token") || "";
    document.getElementById("token").value = token;

    if (!token) {
        document.getElementById("msg").style.color = "red";
        document.getElementById("msg").textContent = "Invalid or missing reset link.";
        document.getElementById("resetForm").style.display = "none";
    }

    document.getElementById("resetForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const confirm  = document.getElementById("confirm").value;
        const msg      = document.getElementById("msg");

        if (password !== confirm) {
            msg.style.color = "red";
            msg.textContent = "Passwords do not match.";
            return;
        }

        try {
            const res = await fetch("/users/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, password })
            });
            const data = await res.json();
            if (data.success) {
                msg.style.color = "green";
                msg.textContent = data.message;
                document.getElementById("resetForm").style.display = "none";
                setTimeout(() => window.location.href = "/login", 2000);
            } else {
                msg.style.color = "red";
                msg.textContent = data.message;
            }
        } catch (err) {
            msg.style.color = "red";
            msg.textContent = "Unable to connect to the server.";
        }
    });
</script>

</body>
</html>
